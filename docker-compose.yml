services:
  secret_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: secret_store
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync
          path: ./cmd
          target: /app/cmd
        - action: sync
          path: ./internal
          target: /app/internal
        - action: sync
          path: ./.air.toml
          target: /app/.air.toml
        - action: sync
          path: ./migrations
          target: /app/migrations
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
        - action: rebuild
          path: ./Dockerfile
